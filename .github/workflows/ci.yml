name: build-and-test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - run: go version
      - name: build all packages
        run: go build ./...
      - name: build soga binary (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o soga ./cmd/soga
      - run: ls -la soga && file soga
      - uses: actions/upload-artifact@v4
        with:
          name: soga-linux-amd64
          path: soga

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - name: enable unprivileged user namespaces + iproute2 (netns integration fixtures)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq iproute2
          unshare --user --net true && echo "userns OK"
      - name: go vet
        run: go vet ./... || true
      - name: go test (linux/amd64, native)
        run: go test ./...
