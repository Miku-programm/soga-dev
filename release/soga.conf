# soga 配置文件，每行一个配置，格式为 key=value，以 # 开头的行为注释
# 也可以使用命令修改: soga config k1=v1 k2=v2

# 面板类型: sspanel-uim, xboard, v2board, xiaov2board, whmcs, proxypanel, ppanel, v2raysocks, soga-v1
type=xboard
# 后端类型: v2ray, trojan, ss, ssr, vless, hysteria, anytls, mieru
server_type=v2ray
# 节点 id，多个以逗号分隔，例如 1,2,3
node_id=1
# 授权码
soga_key=
# 对接方式: webapi 或 db
api=webapi

# webapi 对接
webapi_url=https://xxx.com/
webapi_key=xxx

# db 对接（api=db 时填写）
#db_host=
#db_port=3306
#db_name=
#db_user=root
#db_password=

# 手动证书
#cert_file=
#key_file=

# 自动申请证书
#cert_domain=
#cert_mode=http
#cert_key_length=ec-256

# 其他常用配置
#default_dns=
#user_conn_limit=0
#user_speed_limit=0
#node_speed_limit=0
#proxy_protocol=false
#forbidden_bit_torrent=false
#auto_update=false
log_level=info
